<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#fafafa;
color:#222;
line-height:1.6;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 8%;
background:#1F3C88;
color:white;
}

.logo{
font-weight:600;
letter-spacing:2px;
}

nav a{
margin-left:20px;
text-decoration:none;
color:white;
font-size:14px;
}

nav a:hover{
color:#F2C94C;
}

.intro{
text-align:center;
padding:60px 10%;
background:#F2F7FF;
}

.intro h1{
font-size:36px;
color:#1F3C88;
}

.gallery-section{
padding:70px 10%;
text-align:center;
}

.category-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
}

.category{
cursor:pointer;
transition:.3s;
box-shadow:0 3px 10px rgba(0,0,0,.15);
border-radius:8px;
overflow:hidden;
background:white;
}

.category img{
width:100%;
height:300px;
object-fit:cover;
}

.category h3{
padding:15px;
}

.category:hover{
transform:scale(1.05);
border:2px solid #F2C94C;
}

.video-section,
.school,
.contact,
.register,
.testimonials{
padding:60px 10%;
text-align:center;
}

.video-container{
max-width:800px;
margin:auto;
position:relative;
padding-bottom:56.25%;
}

.video-container iframe{
position:absolute;
width:100%;
height:100%;
left:0;
top:0;
}

.testimonial-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:25px;
}

.testimonial{
background:white;
padding:25px;
box-shadow:0 3px 10px rgba(0,0,0,.1);
border-left:4px solid #F2C94C;
}

.register form{
max-width:400px;
margin:auto;
display:flex;
flex-direction:column;
gap:10px;
}

input,select,textarea{
padding:12px;
}

button{
background:#1F3C88;
color:#F2C94C;
padding:12px;
border:none;
cursor:pointer;
}

.album-popup,
.enlarge-popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.9);
display:none;
justify-content:center;
align-items:center;
z-index:999;
}

.album-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
width:80%;
}

.album-grid img{
width:100%;
}

.enlarge-popup img{
max-width:90%;
max-height:90%;
}

.close-btn{
position:absolute;
top:20px;
right:30px;
font-size:40px;
color:white;
cursor:pointer;
}

.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
padding:15px;
border-radius:50%;
font-size:25px;
}

footer{
background:#1F3C88;
color:white;
padding:20px;
text-align:center;
}

@media(max-width:768px){

.header{
flex-direction:column;
}

.testimonial-grid{
grid-template-columns:1fr;
}

}
</style>
<script>

const albums = {

oil:[
"https://raw.githubusercontent.com/Komalartgallery/komal-art-gallery/main/images/oil1.jpg.JPG",
"https://raw.githubusercontent.com/Komalartgallery/komal-art-gallery/main/images/oil2.jpg.JPG",
"https://raw.githubusercontent.com/Komalartgallery/komal-art-gallery/main/images/oil3.jpg.JPG"
],

pencil:[
"https://raw.githubusercontent.com/Komalartgallery/komal-art-gallery/main/images/pencil1.jpg.JPG",
"https://raw.githubusercontent.com/Komalartgallery/komal-art-gallery/main/images/pencil2.jpg.JPG",
"https://raw.githubusercontent.com/Komalartgallery/komal-art-gallery/main/images/pencil3.jpg.JPG"
],

fabric:[
"https://raw.githubusercontent.com/Komalartgallery/komal-art-gallery/main/images/fabric1.jpg.jpg",
"https://raw.githubusercontent.com/Komalartgallery/komal-art-gallery/main/images/fabric2.jpg.JPG",
"https://raw.githubusercontent.com/Komalartgallery/komal-art-gallery/main/images/fabric3.jpg.jpg"
],

mosaic:[
"https://raw.githubusercontent.com/Komalartgallery/komal-art-gallery/main/images/mosaic1.jpg.jpg",
"https://raw.githubusercontent.com/Komalartgallery/komal-art-gallery/main/images/mosaic2.jpg.jpg",
"https://raw.githubusercontent.com/Komalartgallery/komal-art-gallery/main/images/mosaic3.jpg.jpg"
]

};



function openAlbum(category){

let popup=document.getElementById("albumPopup");
let grid=document.getElementById("albumGrid");

grid.innerHTML="";


albums[category].forEach(function(imageURL){

let img=document.createElement("img");

img.src=imageURL;

img.onclick=function(){

openImage(imageURL);

};

grid.appendChild(img);

});


popup.style.display="flex";

}



function closeAlbum(){

document.getElementById("albumPopup").style.display="none";

}



function openImage(imageURL){

document.getElementById("bigImage").src=imageURL;

document.getElementById("imagePopup").style.display="flex";

}



function closeImage(){

document.getElementById("imagePopup").style.display="none";

}


</script>
